[project]
name = "node-audit"
version = "0.3.0"
description = "Clash/mihomo 节点质量审计：IP 身份 · 纯净度 · 延迟 · 测速"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "node-audit contributors" }]
keywords = ["clash", "mihomo", "clash-verge", "proxy", "ip-quality", "residential-ip"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet",
  "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
node-audit = "node_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/node_audit"]
